<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Калькулятор</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#f6f8fa;color:#1f2937}
main{max-width:900px;margin:24px auto;padding:20px;background:#fff;border-radius:12px;box-shadow:0 2px 10px rgba(0,0,0,.08)}
h1{margin-top:0;font-size:24px}
.warning{padding:10px;border-radius:8px;background:#fff7ed;border:1px solid #fed7aa;font-size:14px;line-height:1.4;margin-bottom:16px}
.tabs{display:flex;gap:8px;margin:16px 0;flex-wrap:wrap}
.tabs button{padding:10px 14px;border:1px solid #cbd5e1;border-radius:8px;background:#eef2ff;cursor:pointer;font-size:15px}
.tabs button.active{background:#2563eb;color:#fff;border-color:#2563eb}
.tab-page{display:none}
.tab-page.active{display:block}
label{display:block;margin:12px 0 6px;font-weight:bold}
input,select,textarea{width:100%;box-sizing:border-box;padding:10px;border:1px solid #cbd5e1;border-radius:8px;font-size:16px}
textarea{min-height:70px;resize:vertical;font-size:14px;font-weight:normal}
.result{margin-top:16px;padding:14px;border-radius:10px;background:#eff6ff;border:1px solid #bfdbfe;font-size:16px;line-height:1.6}
.small{color:#64748b;font-size:13px;margin-top:8px;line-height:1.5}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
@media(max-width:600px){.grid{grid-template-columns:1fr}}
.cb-wrap{position:relative;display:block}
.cb-list{display:none;position:absolute;left:0;right:0;top:100%;z-index:30;max-height:250px;overflow-y:auto;background:#fff;border:1px solid #94a3b8;border-radius:8px;box-shadow:0 6px 16px rgba(0,0,0,.18)}
.cb-list.open{display:block}
.cb-item{padding:9px 10px;cursor:pointer;font-size:14px;font-weight:normal}
.cb-item.hl{background:#dbeafe}
</style>
</head>
<body>
<main>
<h1>Калькулятор</h1>
<div class="tabs">
<button id="tabBtn1" class="active" onclick="openTab(1)">Инфузии</button>
<button id="tabBtn2" onclick="openTab(2)">Расчет препаратов</button>
<button id="tabBtn3" onclick="openTab(3)">ИПС</button>
<button id="tabBtn4" onclick="openTab(4)">Электролиты</button>
<button id="tabBtn5" onclick="openTab(5)">Ушные капли</button>
</div>

<div id="page1" class="tab-page active">
<label>Вид животного<select id="species"><option value="dog">Собака</option><option value="cat">Кошка</option></select></label>
<label>Масса тела, кг<input id="weight" type="number" min="0" step="0.1" inputmode="decimal" placeholder="Например, 20"></label>
<label>Обезвоживание, %<input id="dehyd" type="number" min="0" step="0.5" inputmode="decimal" placeholder="0, если нет"></label>
<label>Текущие потери (рвота/диарея/моча), мл/сут<input id="losses" type="number" min="0" step="1" inputmode="decimal" placeholder="0, если нет"></label>
<div class="result" id="res1">Введите данные — расчёт автоматический.</div>
</div>

<div id="page2" class="tab-page">
<label>Вид животного<select id="bSpecies"><option value="dog">Собака</option><option value="cat">Кошка</option></select></label>
<label>Препарат
<span class="cb-wrap"><input id="bDrugInput" type="text" placeholder="Клик — весь список; начни печатать — фильтр" autocomplete="off"><div id="bDrugList" class="cb-list"></div></span>
</label>
<label>Масса тела, кг<input id="bWeight" type="number" min="0" step="0.1" inputmode="decimal" placeholder="Например, 4"></label>
<label>Доза<input id="bDose" type="number" min="0" step="0.01" inputmode="decimal"></label>
<label id="bConcLabel">Концентрация<input id="bConc" type="number" min="0" step="0.01" inputmode="decimal"></label>
<label>Примечание<textarea id="bNote" readonly></textarea></label>
<div class="result" id="res2">Выберите препарат и введите массу.</div>
</div>

<div id="page3" class="tab-page">
<label>Препарат для ИПС
<span class="cb-wrap"><input id="ipsDrugInput" type="text" placeholder="Клик — весь список; начни печатать — фильтр" autocomplete="off"><div id="ipsDrugList" class="cb-list"></div></span>
</label>
<div class="grid">
<label>Масса тела, кг<input id="ipsWeight" type="number" min="0" step="0.1" inputmode="decimal" placeholder="Например, 3"></label>
<label><span id="ipsDoseTxt">Целевая доза</span><input id="ipsDose" type="number" min="0" step="0.01" inputmode="decimal"></label>
<label>Концентрация ампулы<input id="ipsConc" type="number" min="0" step="0.01" inputmode="decimal"></label>
<label>Объём шприца/флакона, мл<input id="ipsSyringe" type="number" min="1" step="1" inputmode="decimal" value="20"></label>
</div>
<label>Скорость инфузомата, мл/ч<input id="ipsRate" type="number" min="0.1" step="0.1" inputmode="decimal" value="2"></label>
<label>Примечание<textarea id="ipsNote" readonly></textarea></label>
<div class="result" id="res3">Введите данные для расчёта ИПС.</div>
</div>

<div id="page4" class="tab-page">
<label>Ситуация<select id="eSit">
<option value="hypoK">Гипокалиемия</option>
<option value="hyperK">Гиперкалиемия</option>
<option value="hypoCa">Гипокальциемия</option>
<option value="hyperCa">Гиперкальциемия</option>
<option value="soda">Гиперкальциемический криз</option>
<option value="hypoNa">Гипонатриемия</option>
<option value="hyperNa">Гипернатриемия</option>
<option value="hypoMg">Гипомагниемия</option>
<option value="hyperMg">Гипермагниемия</option>
</select></label>
<div class="grid">
<label>Масса тела, кг<input id="eWeight" type="number" min="0" step="0.1" inputmode="decimal" placeholder="Например, 5"></label>
<label id="gSpecies">Вид<select id="eSpecies"><option value="dog">Собака</option><option value="cat">Кошка</option></select></label>
<label id="gK">Калий крови, ммоль/л<input id="eK" type="number" step="0.1" inputmode="decimal" placeholder="Например, 2.5"></label>
<label id="gKT">Целевой калий, ммоль/л<input id="eKT" type="number" step="0.1" inputmode="decimal" value="3.5"></label>
<label id="gNaCur">Натрий крови, ммоль/л<input id="eNaCur" type="number" step="1" inputmode="decimal" placeholder="Например, 115"></label>
<label id="gNaT">Целевой натрий, ммоль/л<input id="eNaT" type="number" step="1" inputmode="decimal"></label>
<label id="gHydr">Статус гидратации<select id="eHydr"><option value="0">Без обезвоживания</option><option value="56">Обезвоживание 5–6%</option><option value="810">8–10% / кардио / ОПП</option></select></label>
<label id="gCaD">Доза Ca глюконата 10%, мл/кг/ч<select id="eCaD"><option value="0.5">0.5</option><option value="0.75">0.75</option><option value="1">1.0</option><option value="0.25">0.25 (после болюса)</option><option value="0.375">0.375 (после болюса)</option></select></label>
<label id="gKSel">Калий для рецепта<select id="eKSel"><option value="norm">K нормальный</option><option value="3035">K 3.0–3.5 ммоль/л</option><option value="lt30">K &lt;3.0 ммоль/л</option></select></label>
<label id="gFlask">Объём флакона, мл<input id="eFlask" type="number" min="1" step="1" inputmode="decimal" value="500"></label>
<label id="gRate">Скорость инфузомата, мл/ч<input id="eRate" type="number" min="0.1" step="0.1" inputmode="decimal" value="10"></label>
<label id="gHours">Время инфузии, ч<input id="eHours" type="number" min="0.5" step="0.5" inputmode="decimal" value="12"></label>
<label id="gMgD">Доза Mg, мЭкв/кг/ч<input id="eMgD" type="number" min="0" step="0.005" inputmode="decimal" value="0.03"></label>
<label id="gSol">Раствор<select id="eSol"><option value="513">3% NaCl (513 ммоль/л)</option><option value="154">0.9% NaCl (154 ммоль/л)</option><option value="130">Рингер лактат (130 ммоль/л)</option><option value="77">0.45% NaCl (77 ммоль/л)</option><option value="0">5% глюкоза (0 ммоль/л)</option></select></label>
</div>
<div class="result" id="res4">Выберите ситуацию и введите данные.</div>
</div>
<label>Нужный объём капель, мл<input id="uVol" type="number" min="1" step="0.5" value="10" inputmode="decimal"></label>
<div id="uRows"></div>
<button id="uAdd" type="button" style="margin-top:10px;padding:10px 14px;border:0;border-radius:8px;background:#2563eb;color:#fff;cursor:pointer">+ добавить компонент</button>
<div class="result" id="res5">Укажите объём — расчёт автоматический.</div>
</div>
</main>

<script>
function openTab(n){for(let i=1;i<=5;i++){document.getElementById('page'+i).classList.toggle('active',i===n);document.getElementById('tabBtn'+i).classList.toggle('active',i===n);}}
function r1(x){return Math.round(x*10)/10}
function r2(x){return Math.round(x*100)/100}
function fmtVol(v){return v<1?v.toFixed(3):v.toFixed(2)}
function fmtD(v){return v<10?v.toFixed(2):v.toFixed(1)}
function fmtTab(v){return Math.round(v*100)/100}

/* ===== ВКЛАДКА 1 ===== */
const speciesEl=document.getElementById('species'),weightEl=document.getElementById('weight'),dehydEl=document.getElementById('dehyd'),lossesEl=document.getElementById('losses'),res1=document.getElementById('res1');
function calcInfusion(){
const kg=Number(weightEl.value);
if(!kg||kg<=0){res1.textContent='Введите массу тела.';return}
const dehyd=Number(dehydEl.value)||0,losses=Number(lossesEl.value)||0;
const maintenance=kg*30+70,deficit=kg*dehyd*10,daily=maintenance+deficit+losses,rate=daily/24;
const allo=(speciesEl.value==='dog'?132:80)*Math.pow(kg,0.75)/24;
const bolus=speciesEl.value==='dog'?[15*kg,20*kg,'10–15 мин']:[5*kg,10*kg,'15–20 мин'];
res1.innerHTML='Поддержка: <b>'+r1(maintenance)+' мл/сут</b><br>Дефицит ('+dehyd+'%): <b>'+r1(deficit)+' мл</b><br>Потери: <b>'+r1(losses)+' мл/сут</b><br>Итого: <b>'+r1(daily)+' мл/сут</b> → скорость <b>'+r1(rate)+' мл/ч</b><br>Аллометрическая скорость: <b>'+r1(allo)+' мл/ч</b><br>Шоковый болюс: <b>'+r1(bolus[0])+'–'+r1(bolus[1])+' мл</b> за '+bolus[2]+'<br>Микроболюс (сердечники): <b>'+r1(kg)+'–'+r1(3*kg)+' мл</b>';
}
[speciesEl,weightEl,dehydEl,lossesEl].forEach(el=>{el.addEventListener('input',calcInfusion);el.addEventListener('change',calcInfusion)});
calcInfusion();

/* ===== ВКЛАДКА 2: Расчет препаратов ===== */
const bolusDrugs=[
{name:'Адреналин 1 мг/мл',dog:0.01,cat:0.01,unit:'mg/kg',conc:1,form:'inj',note:'0.1 мг/кг в/в, повтор через 3–5 мин.'},
{name:'Фуросемид 10 мг/мл (НКОЛ)',dog:2,cat:2,unit:'mg/kg',conc:10,form:'inj',note:'Всем 2-4 мг/кг в/в. Более не вводим.'},
{name:'Фуросемид 10 мг/мл (КОЛ)',dog:2,cat:2,unit:'mg/kg',conc:10,form:'inj',note:'Стартуем с 2 мг/кг, потом болюс 1 мг/кг и переход на ИПС 1 мг/кг/ч.'},
{name:'Димедрол 10 мг/мл',dog:3,cat:1.5,unit:'mg/kg',conc:10,form:'inj',note:'Собаки: 3–4 мг/кг, в/м. Кошки: 1.5–2 мг/кг, в/м.'},
{name:'Дексаметазон 4 мг/мл',dog:0.05,cat:0.05,unit:'mg/kg',conc:4,form:'inj',note:'Воспаление: 0.05-0,2 мг/кг (до 5 дн.). Иммуносупрессия: 0,3-0,5 мг/кг (до 5 дней). Гипоадренокортицизм: 0,2 мг/мл. Отек ГМ: 2-3 мг/кг в/в, затем 1 мг/кг каждые 6 ч. МДП: 0,01 мг/кг в/в.'},
{name:'Преднизолон 30 мг/мл',dog:0.5,cat:0.5,unit:'mg/kg',conc:30,form:'inj',note:'Воспаление: 0,5 мг/кг каждые 12-24 ч, постепенно снижая до 0,25-0,5 мг/кг каждые 48 ч. Иммуносупрессия: 1-2 мг/кг, снижая до 0,5 мг/кг каждые 48 ч.'},
{name:'Кальция глюконат 10%',dog:0.5,cat:0.5,unit:'ml/kg',conc:0,form:'inj',note:'Гипокальциемия: 0.5–1 мл/кг однократно. Гиперкалиемия: 0.5–1 мл/кг, более 20 минут с контролем ЭКГ.'},
{name:'Глюкоза 40%',dog:1,cat:1,unit:'ml/kg',conc:0,form:'inj',note:'1 мл/кг в/в.'},
{name:'Винсувет/Канинсулин 40 ЕД/мл',dog:0.25,cat:0.25,unit:'ED/kg',conc:40,form:'inj',note:'Начальная 0.25–0.5 ЕД/кг 2 р/д; кошкам при любом весе - 2 ЕД.'},
{name:'NaCl 7.2–7.5%',dog:3,cat:2,unit:'ml/kg',conc:0,form:'inj',note:'Собаки: 3–5 мл/кг. Кошки: 2–3 мл/кг.'},
{name:'NaCl 3%',dog:2,cat:2,unit:'ml/kg',conc:0,form:'inj',note:'2–6 мл/кг за 10–15 мин. Далее переход на ИПС 0.5–2 мл/кг/ч 48 ч.'},
{name:'Натрия гидрокарбонат 8.4%',dog:0.5,cat:0.5,unit:'mEq/kg',conc:1,form:'inj',note:'0.5–1 мЭкв/кг за 2–4 ч.(см. Электролиты).'},
{name:'Лидокаин 20 мг/мл (при ЖТ,ФЖ жел. экстрасистолах)',dog:2,cat:0.25,unit:'mcg/kg',conc:20,form:'inj',note:'Собаки: 2 мг/кг в/в, затем на ИПС 0,025–0,1 мг/кг/мин. Кошки: 0,25–0,5 мг/кг медленно, затем на ИПС 0,01–0,04 мг/кг/мин.'},
{name:'Лидокаин 20 мг/мл (боль)',dog:2,cat:0.25,unit:'mcg/kg',conc:20,form:'inj',note:'Собаки: ИПС: 20-100 мкг/кг/мин. Кошки: ИПС 20-40 мкг/кг/мин.'},
{name:'Амиодарон 50 мг/мл',dog:5,cat:5,unit:'mg/kg',conc:50,form:'inj',note:'5–10 мг/кг в/в за 30–60 мин (желудочковая тахикардия).'},
{name:'Золетил (Тилетамин-Золазепам) 100 мг/мл',dog:0.5,cat:0.5,unit:'mg/kg',conc:100,form:'inj',note:'0,5-2 мг/кг в/в (индукция). ИПС: 0,25-2 мг/кг/ч.'},
{name:'Золетил (Тилетамин-Золазепам) 50 мг/мл',dog:0.5,cat:0.5,unit:'mg/kg',conc:50,form:'inj',note:'0,5-2 мг/кг в/в (индукция). ИПС: 0,25-2 мг/кг/ч.'},
{name:'Дексдомитор 0,1 (седация, анальгезия)',dog:0.5,cat:0.5,unit:'ml/kg',form:'inj',note:'Собаки - 0,5-2,0 мл/10 кг. Кошки - 0,5 мл/кг.'},
{name:'Дексдомитор 0,1 (премедикация)',dog:0.2,cat:0.5,unit:'ml/kg',form:'inj',note:'Собаки: для 2-3 кг - 0,2 мл. Для 3-4 кг - 0,25 мл. Для 4-5 кг - 0,35 мл. Для 5-10 кг - 0,5 мл. Для 10-13 кг - 0,65 мл. Для 13-15 кг - 0,75 мл. Для 15-20 кг - 0,85 мл. Кошки: 0,5 мл/кг.'},
{name:'Антимедин (Атипамезол) 5 мг/мл',dog:null,cat:null,unit:'mg/kg',form:'inj',note:'Собаки: доза в мл равна введенному кол-чу мл ДДМ. Если прошел 1 час, вводим 1/2 дозы. Кошки: вводим 1/2 дозу.'},
{name:'Пимобендан (Ветмедин, Кордиамин) 0,75 мг/мл',dog:0.15,cat:0.2,unit:'mg/kg',conc:0.75,form:'inj',note:'Собаки: 0,15 мг/кг в/в. Кошки: 0,2-0,3 мг/кг'},
{name:'Соталол',dog:0.5,cat:2,unit:'mg/kg',form:'tab',note:'Собаки: 0,5-3,0 мг/кг каждые 12 ч. Кошки: 2 мг/кг каждые 12 ч.'},
{name:'Клопидогрел 75 мг',dog:1.1,cat:18.75,unit:'mg/kg',conc:75,form:'tab',note:'Собаки: 1,1-3,0 мг/кг, нагрузочная 4-10 мг/кг. Кошка: 18,75 мг на кошку, нагрузочная - 37,5 мг/кг.'},
{name:'Габапентин (ветгаба) 100 мг/мл',dog:10,cat:10,unit:'mg/kg',conc:100,form:'inj',note:'Собака: 10-30 мг/кг, каждые 6-8 ч. Кошки: 10-40 мг/кг, каждые 6-8 ч.'},
{name:'Тразодон (Экспресс-успокоин, Триттико)',dog:7,cat:7,unit:'mg/kg',conc:24,form:'tab',note:'5-7 мг/кг каждые 12 ч.'},
{name:'Атропин 1 мг/мл',dog:0.01,cat:0.01,unit:'mg/kg',conc:1,form:'inj',note:'0.01 мг/кг в/в.'},
{name:'Транексамовая кислота 50 мг/мл',dog:10,cat:10,unit:'mg/kg',conc:50,form:'inj',note:'Собаки, кошки: 10–15 мг/кг в/в. Для рвоты - 50-100 мг/кг, болюсно.'},
{name:'Супрастин 20 мг/мл',dog:0.1,cat:0.1,unit:'ml/kg',conc:0,form:'inj',note:'Собаки: меньше 10 кг — 0.1 мл/кг. 10–20 кг — 1 мл. 20 кг — 2 мл. Кошки: 0.1 мл/кг.'},
{name:'S-аденозилметионин (Гептрал) 400 мг/фл',dog:20,cat:20,unit:'mg/kg',conc:400,form:'inj',note:'20 мг/кг внутрь за 1 ч. до еды или в/м, в/в, каждые 24 ч.'},
{name:'Альмагель',dog:0.5,cat:0.5,unit:'ml/kg',conc:0,form:'inj',note:'0.5–1 мл/кг с едой или сразу после еды.'},
{name:'Амитриптилин 25 мг',dog:1,cat:0.5,unit:'mg/kg',conc:25,form:'tab',note:'Собаки: 1–2 мг/кг 1 раз в 12-24 ч. Кошки: 0.5–1 мг/кг, 1 раз в сутки.'},
{name:'Амлодипин 5 мг',dog:0.05,cat:0.625,unit:'mg/kg',conc:5,form:'tab',note:'0.05–0.1 мг/кг 1–2 раз в сутки, постепенно можно повысить до 0.4 мг/кг. Кошки: 0,625-1,25 мг на кошку 1 раз в сутки.'},
{name:'Витамин B1 (Этиленгликоль)',dog:100,cat:100,unit:'mg (fixed)',conc:50,form:'inj',note:'100 мг на кошку/собаку, каждые 24 ч.'},
{name:'Витамин B1 (отравление свинцом)',dog:2,cat:2,unit:'mg (fixed)',conc:50,form:'inj',note:'Собаки: 2 мг/кг в/м, п/к, каждые 12 ч. Кошки: 2 мг/кг в/м, п/к, каждые 12 ч.'},
{name:'Витамин B1 (тиамин) (дефицит)',dog:50,cat:10,unit:'mg (fixed)',conc:50,form:'inj',note:'Собаки: 50-250 мг на собаку в/м, п/к, каждые 24 ч. Кошки: 10-25 мг на кошку, в/м, п/к, каждые 12-24 ч.'},
{name:'Витамин B6 (пиридоксин) 50 мг/мл',dog:71,cat:null,unit:'mg/kg',conc:50,form:'inj',note:'При отравлении изониазидом: 71 мг/кг в/в за 30–60 мин.'},
{name:'Витамин B12 200 мкг/мл',dog:500,cat:125,unit:'mcg (fixed)',conc:200,form:'inj',note:'Собаки:250–1000 мкг на собаку. Кошки: 125–250 мкг на кошку.'},
{name:'Витамин K1 10 мг/мл (варфарин, ратиндан)',dog:2.5,cat:2.5,unit:'mg/kg',conc:10,form:'inj',note:'2.5 мг/кг п/к в разные места, затем 1–2.5 мг/кг внутрь 5–7 дн.'},
{name:'Витамин K1 10 мг/мл (бродифакум, бромадиолон, дифенакум)',dog:5,cat:5,unit:'mg/kg',conc:10,form:'inj',note:'5 мг/кг п/к в разные места, затем 2.5 мг/кг внутрь каждые 12 ч., в течение 21 дня.'},
{name:'Силденафил 25 мг (Виагра)',dog:0.5,cat:1.6,unit:'mg/kg',conc:25,form:'tab',note:'Собаки: 0.5–3 мг/кг, каждые 8-24 ч. Кошки: 1,6 мг/кг, каждые 12 ч.'},

let uRecipe=[

const uRows=document.getElementById('uRows'),uVol=document.getElementById('uVol'),res5=document.getElementById('res5'),uAdd=document.getElementById('uAdd');

function calcU(){
const V=Number(uVol.value);
if(!V||V<=0){res5.textContent='Укажите нужный объём.';return}
const baseTotal=uRecipe.reduce((s,r)=>s+(Number(r.base)||0),0);
if(baseTotal<=0){res5.textContent='Базовый рецепт пуст.';return}
const dilIdx=uRecipe.findIndex(r=>r.diluent);
let out='',sum=0;
if(dilIdx>=0){
const act=uRecipe.filter(r=>r.inc&&!r.diluent);
let actSum=0;const lines=[];
act.forEach(r=>{const v=r.base/baseTotal*V;actSum+=v;lines.push(r.name+': <b>'+r2(v)+'мл</b>')});
const dilV=V-actSum;
if(dilV<0){res5.innerHTML='<b>Ошибка:</b> объём включённых компонентов ('+r2(actSum)+' мл) больше нужного объёма. Увеличьте объём или уберите компоненты.';return}
out=lines.join('<br>')+'<br>'+uRecipe[dilIdx].name+': <b>'+r2(dilV)+' мл</b>';
sum=actSum+dilV;
}else{
const incR=uRecipe.filter(r=>r.inc);
const incB=incR.reduce((s,r)=>s+(Number(r.base)||0),0);
if(incB<=0){res5.textContent='Нет включённых компонентов.';return}
incR.forEach(r=>{const v=r.base/incB*V;sum+=v;out+=(out?'<br>':'')+r.name+': <b>'+r2(v)+' мл</b>'});
out+='<br><span style="color:#64748b">Без разбавителя: компоненты масштабированы пропорционально.</span>';
}
out+='<br>Проверка: итого = <b>'+r2(sum)+' мл</b>';
res5.innerHTML=out;
}
uAdd.addEventListener('click',()=>{uRecipe.push({name:'Новый компонент',base:1,diluent:false,inc:true});renderU();calcU()});
uVol.addEventListener('input',calcU);
renderU();calcU();
</script>
